name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm typecheck:tests

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Start Anvil
        run: |
          anvil --host 127.0.0.1 --port 8545 &
          for i in $(seq 1 30); do
            if cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then
              echo "anvil is up"
              exit 0
            fi
            sleep 1
          done
          echo "anvil failed to start"
          exit 1

      - run: pnpm lint:check

      - run: pnpm test:coverage
        env:
          LOCAL_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
          RPC_URL: "http://127.0.0.1:8545"
          CHAIN_ID: "31337"
          DATABASE_PATH: "./data/test-custody.db"
          SIGNER_BACKEND: "local"

      - name: Upload coverage lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      - run: pnpm build

  softhsm-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Start Compose (SoftHSM + Anvil + API)
        run: docker compose up -d --build

      - name: Wait for Anvil RPC and API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8545 \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' \
              >/dev/null \
              && curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              echo "anvil and api are up"
              exit 0
            fi
            sleep 2
          done
          echo "stack failed to become ready"
          docker compose logs
          exit 1

      - name: Live demo (gated SoftHSM signing)
        run: |
          set -euo pipefail
          if ! docker compose exec -T api pnpm demo | tee /tmp/demo.out; then
            echo "demo failed"
            docker compose logs
            exit 1
          fi
          if ! grep -q 'verified: true' /tmp/demo.out \
            || ! grep -Eq 'txHash: 0x[0-9a-fA-F]{64}' /tmp/demo.out; then
            echo "demo exited 0 but did not print verified/txHash (CLI may not have run)"
            cat /tmp/demo.out
            docker compose logs
            exit 1
          fi

      - name: Stop Compose
        if: always()
        run: docker compose down -v

  softhsm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: SoftHSM live signer tests
        run: >
          docker compose run --rm --build api
          pnpm exec vitest run
          test/signers/softHsm.test.ts
          test/signers/createSigner.test.ts

      - name: Stop Compose
        if: always()
        run: docker compose down -v
