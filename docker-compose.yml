services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      SIGNER_BACKEND: softhsm
      SOFTHSM_PIN: "1234"
      SOFTHSM_KEY_LABEL: custody-eth
      RPC_URL: http://anvil:8545
      CHAIN_ID: "31337"
      POLICY_MAX_VALUE: "1000000000000000000"
      POLICY_ALLOWLIST: "0x00000000000000000000000000000000000000c8"
      POLICY_QUORUM: "1"
      API_KEY_INITIATORS: dev-initiator
      API_KEY_APPROVERS: dev-approver
      API_KEY_ADMINS: dev-admin
      DATABASE_PATH: /data/custody.db
    volumes:
      - softhsm-data:/data
    depends_on:
      anvil:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  softhsm-data:
